name: Deploy Portfolio to GitHub Pages (Free)

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy to GitHub Pages (resume or landing)'
        required: true
        type: choice
        default: 'resume'
        options:
          - resume
          - landing
      resume_template:
        description: 'Resume template (used ONLY when deploy_target = resume; ignored for landing)'
        required: false
        type: choice
        default: '01-bento-glass'
        options:
          - 01-bento-glass
          - 02-terminal-ide
          - 03-swiss-editorial
          - 04-nordic-fintech
          - 05-executive-split
          - 07-architect-sidebar-cv
          - 08-azure-cloud-portal
          - 09-minimal-mono-craft
          - 10-interactive-tabbed-folio
          - all-templates-hub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Stage (${{ inputs.deploy_target }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage deployment bundle (dist/)
        run: |
          node scripts/build-deploy.mjs \
            --target "${{ inputs.deploy_target }}" \
            --template "${{ inputs.resume_template }}" \
            --out dist

      - name: Write deployment summary
        run: |
          {
            echo "### GitHub Pages Deployment Summary"
            echo "- **Target**: \`${{ inputs.deploy_target }}\`"
            if [ "${{ inputs.deploy_target }}" = "landing" ]; then
              echo "- **Template**: *(not applicable — RedisGUI landing page)*"
            else
              echo "- **Template**: \`${{ inputs.resume_template }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
