name: Deploy Portfolio to Azure Static Web Apps

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy to Azure (resume or landing)'
        required: true
        type: choice
        default: 'resume'
        options:
          - resume
          - landing
      resume_template:
        description: 'Resume template (used ONLY when deploy_target = resume; ignored for landing)'
        required: false
        type: choice
        default: '01-bento-glass'
        options:
          - 01-bento-glass
          - 02-terminal-ide
          - 03-swiss-editorial
          - 04-nordic-fintech
          - 05-executive-split
          - 07-architect-sidebar-cv
          - 08-azure-cloud-portal
          - 09-minimal-mono-craft
          - 10-interactive-tabbed-folio
          - 11-classic-pdf
          - all-templates-hub

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: Build & Deploy (${{ inputs.deploy_target }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage deployment bundle (dist/)
        run: |
          node scripts/build-deploy.mjs \
            --target "${{ inputs.deploy_target }}" \
            --template "${{ inputs.resume_template }}" \
            --out dist

      - name: Write deployment summary
        run: |
          {
            echo "### Azure Deployment Summary"
            echo "- **Target**: \`${{ inputs.deploy_target }}\`"
            if [ "${{ inputs.deploy_target }}" = "landing" ]; then
              echo "- **Template**: *(not applicable — RedisGUI landing page)*"
            else
              echo "- **Template**: \`${{ inputs.resume_template }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          skip_app_build: true
