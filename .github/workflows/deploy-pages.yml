name: Deploy Resume to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      resume_template:
        description: 'Select resume template to deploy to https://dellik95.github.io/portfolio/'
        required: true
        type: choice
        default: '02-terminal-ide'
        options:
          - 01-bento-glass
          - 02-terminal-ide
          - 03-swiss-editorial
          - 04-nordic-fintech
          - 05-executive-split
          - 07-architect-sidebar-cv
          - 08-azure-cloud-portal
          - 09-minimal-mono-craft
          - 10-interactive-tabbed-folio
          - all-templates-hub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Stage (${{ inputs.resume_template }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage resume bundle (dist/)
        run: |
          node scripts/build-deploy.mjs \
            --target resume \
            --template "${{ inputs.resume_template }}" \
            --out dist

      - name: Write deployment summary
        run: |
          {
            echo "### GitHub Pages Resume Deployment Summary"
            echo "- **Template**: \`${{ inputs.resume_template }}\`"
            echo "- **RedisGUI Product Page**: https://dellik95.github.io/redis-gui/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
